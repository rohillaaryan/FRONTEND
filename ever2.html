<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test form</title>
</head>
<body>

    <header><h1><b>fill this form</b></h1></header>

    <form action="a form" method="post">

        <div class="label">
            <label for="Name">
                Enter Your Name : 
                <input type="text" placeholder="Lucy Martinez" required id="Name" name="FName">
            </label>
        </div>

        <div class="label">
            <label for="mail">
                Enter Your mail : 
                <input type="email" placeholder="a@y" id="mail" name="Ymail">
            </label>
        </div>

        <div class="label">
            <label for="pass">
                Enter Your password : 
                <input type="password" id="pass" name="passi" required minlength="6">
            </label>
        </div>

        <div class="label">
            <label for="age">
                Enter Your age : 
                <input type="number" placeholder="16+" id="age" name="Oage" required min="16">
            </label>
        </div>

        <div class="label">
            <label for="dob">
                Enter Your dob : 
                <input type="date" id="dob" name="ddate">
            </label>
        </div>

        <div class="label">
            <label for="mmm">
                M or F :<br/>
                Male 
                <input type="radio" id="mmm" name="gendar">
                <!--i dont know how to reset just the radio buttons-->
                <!--wanna learn fieldset and legend-->
            </label>
            <label for="fff">
                Female 
                <input type="radio" id="gender" name="gendar">
            </label>
        </div>

        <div class="label">
            <label for="terms">
                do you agree to our terms : 
                <input type="checkbox" id="terms" name="term">
            </label>
        </div>

        <!--here i need a course selection using select-->
        <select name="" id="">
            <option value="maths"></option>
            <option value="hindi"></option>
            <option value="">english</option>
        </select>

        <button type="reset">clear the form</button>
        <br/><br/>
        <button type="submit">SUBMIT</button>
        
    </form>
    <br/>

    <a href="ever.html">to return</a>
    
</body>
</html>
